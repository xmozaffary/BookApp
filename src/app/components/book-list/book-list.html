<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Mina böcker</h2>
    <a routerLink="/books/add" class="btn btn-primary">
      <i class="fas fa-plus me-2"></i>Lägg till ny bok
    </a>
  </div>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>Titel</th>
        <th>Författare</th>
        <th>Publiceringsdatum</th>
        <th>Åtgärder</th>
      </tr>
    </thead>
    <tbody>
      @for (book of books(); track book.id) {
        <tr>
          <td>{{ book.title }}</td>
          <td>{{ book.author }}</td>
          <td>{{ book.publishedDate.slice(0, 10) }}</td>
          <td>
            <a [routerLink]="['/books/edit', book.id]" class="btn btn-sm btn-warning me-2">
              <i class="fas fa-edit"></i> Redigera
            </a>
            <button (click)="delete(book.id)" class="btn btn-sm btn-danger">
              <i class="fas fa-trash"></i> Radera
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
