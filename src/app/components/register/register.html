<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <h2 class="text-center mb-4">Registrera dig</h2>

      @if (error) {
        <div class="alert alert-danger">{{ error }}</div>
      }

      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Användarnamn</label>
          <input type="text" class="form-control" [(ngModel)]="username" name="username" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Lösenord</label>
          <input
            type="password"
            class="form-control"
            [(ngModel)]="password"
            name="password"
            required
          />
        </div>
        <button type="submit" class="btn btn-success w-100">
          <i class="fas fa-user-plus me-2"></i>Registrera
        </button>
      </form>

      <p class="text-center mt-3">Har du redan ett konto? <a routerLink="/login">Logga in</a></p>
    </div>
  </div>
</div>
